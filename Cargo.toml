[package]
name = "perigee-control"
version = "0.1.0"
edition = "2024"
description = "Perigee ground-station control: the orbit viewer in one window, a tiled command page (live data, motor control, serial console, mount view) in another"

[[bin]]
name = "perigee-control"
path = "src/main.rs"

[dependencies]
# The whole Bevy viewer, unchanged, as a library: perigee_viewer::build_app() gives us its App
perigee-viewer = { path = "../perigee-viewer" }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
chrono-tz = "0.10"
libc = "0.2"        # termios: the serial port is opened and configured by hand, no serial crate

# Same feature set as the viewer (features unify across the workspace of one build), desktop backends on
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_gizmos", "bevy_pbr", "bevy_picking",
    "bevy_render", "bevy_state", "bevy_text", "bevy_ui", "bevy_ui_picking_backend", "bevy_window",
    "bevy_winit", "multi_threaded", "tonemapping_luts", "hdr", "smaa_luts", "x11", "wayland", "png",
] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
